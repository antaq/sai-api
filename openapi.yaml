              contratos: { type: integer }
              participacao_contratos_pct: { type: number }
              investimento_global_nominal: { type: number }
              investimento_global_corrigido: { type: number }
              participacao_valor_pct: { type: number }
              executado_corrigido: { type: number }
              contratos_com_execucao_validada: { type: integer }

    RespostaMapa:
      type: object
      properties:
        metadados: { $ref: '#/components/schemas/Metadados' }
        items:
          type: array
          items:
            type: object
            properties:
              id_execucao: { type: integer }
              cod_contrato: { type: string }
              empresa: { type: string }
              porto_terminal: { type: string }
              local_fiscalizacao: { type: string }
              uf: { type: string }
              regiao: { type: string }
              latitude: { type: number, format: double }
              longitude: { type: number, format: double }
              situacao: { type: string }
              investimento_global_corrigido: { type: number, nullable: true }
              execucao_fisica_pct: { type: number, nullable: true }
              possui_execucao_validada: { type: integer, enum: [0, 1] }

    RespostaIndices:
      type: object
      properties:
        metadados: { $ref: '#/components/schemas/Metadados' }
        items:
          type: array
          items:
            type: object
            properties:

              variacao_mes_pct: { type: number, nullable: true }
              variacao_12meses_pct: { type: number, nullable: true }

    RespostaDominios:
      type: object
      properties:
        metadados: { $ref: '#/components/schemas/Metadados' }
        items:
          type: array
          items:
            type: object
            properties:
              dominio: { type: string, description: 'Nome do catálogo., example: situacao' }
              codigo: { type: string, nullable: true }
              descricao: { type: string }
              aparece_na_api_publica:
                type: integer
                enum: [0, 1]
                description: 0 indica código que existe no sistema mas nunca aparece nesta API.

    RespostaMetadados:
      type: object
      properties:
        metadados: { $ref: '#/components/schemas/Metadados' }
        cobertura:
          type: object
          properties:
            contratos: { type: integer }
            contratos_com_execucao_validada: { type: integer }
            cobertura_execucao_pct: { type: number }
            acompanhamentos_validados: { type: integer }
            data_ultima_validacao: { type: string, format: date, nullable: true }
        limites:
          type: object
          properties:
            limit_padrao: { type: integer }
            limit_maximo: { type: integer }
            export_maximo_linhas: { type: integer }
        dicionario_dados:
          type: array
          description: Descrição de cada campo, extraída dos comentários do banco de dados.
          items:
            type: object
            properties:
              recurso: { type: string }
              campo: { type: string }
              descricao: { type: string }

    Raiz:
      type: object
      properties:
        api: { type: string }
        orgao: { type: string }
        versao: { type: string }
        licenca: { type: string }
        documentacao: { type: string }
        contato: { type: string }
        autenticacao: { type: string }
        criterio_publicidade: { type: string }
        recursos:
          type: array
          items:
            type: object
            properties:
              caminho: { type: string }
              descricao: { type: string }
              formatos: { type: string }
        parametros_comuns:
          type: object
          additionalProperties: { type: string }

    Erro:
      type: object
      properties:
        status: { type: integer, description: Código HTTP. }
        error: { type: string, description: Nome do status HTTP. }

              sigla: { type: string, example: IPCA }
              nome: { type: string }
              fonte: { type: string, description: Instituto responsável pela série. }
              codigo_serie_fonte: { type: string, nullable: true, description: Código da série no sistema da fonte. }
              ativo: { type: integer, enum: [0, 1] }
              primeira_competencia: { type: string, nullable: true, example: '1994-07' }
              ultima_competencia: { type: string, nullable: true, description: Limite até onde a correção pode ser calculada. }
              qtd_competencias: { type: integer }
              contratos_vigentes: { type: integer, description: Contratos que usam este índice atualmente. }

    RespostaSerieIndice:
      type: object
      properties:
        metadados: { $ref: '#/components/schemas/Metadados' }
        pagination: { $ref: '#/components/schemas/Paginacao' }
